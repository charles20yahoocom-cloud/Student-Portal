# Render Blueprint for the PCC Student Portal.
# Configure JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, and SESSION_SECRET in the
# Render Dashboard; never put production secrets in this file.
services:
  - type: web
    name: pcc-student-portal
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: pcc-data
      mountPath: /opt/render/project/pcc-data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: loopback
      - key: DB_PATH
        value: /opt/render/project/pcc-data/pcc.db
      - key: UPLOAD_DIR
        value: /opt/render/project/pcc-data/uploads
      - key: PCC_DATA_DIR
        value: /opt/render/project/pcc-data
