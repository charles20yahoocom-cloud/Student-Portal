# Render Blueprint for the PCC Student Portal.
# Configure JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, SESSION_SECRET, and
# DATABASE_URL in the Render Dashboard; never put production secrets here.
services:
  - type: web
    name: pcc-student-portal
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: loopback
      - key: DATABASE_URL
        sync: false
      - key: NEON_AI_GATEWAY_BASE_URL
        sync: false
      - key: NEON_AI_GATEWAY_TOKEN
        sync: false
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
